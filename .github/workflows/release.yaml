name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check versions match the tag
        run: |
          version=${GITHUB_REF_NAME#v}
          grep -q "^version = \"$version\"" pyproject.toml
          grep -q "^version: $version$" charts/glitchtip-operator/Chart.yaml
          grep -q "^appVersion: \"$version\"$" charts/glitchtip-operator/Chart.yaml
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/glitchtip-operator
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: azure/setup-helm@v4
      - name: Push chart
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/glitchtip-operator
          helm push glitchtip-operator-*.tgz "oci://ghcr.io/$owner/charts"
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes glitchtip-operator-*.tgz
        env:
          GH_TOKEN: ${{ github.token }}
