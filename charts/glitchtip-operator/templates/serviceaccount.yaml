{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "glitchtip-operator.serviceAccountName" . }}
  labels:
    {{- include "glitchtip-operator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.glitchtip.token (not .Values.glitchtip.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "glitchtip-operator.fullname" . }}
  labels:
    {{- include "glitchtip-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.glitchtip.token | quote }}
{{- end }}
